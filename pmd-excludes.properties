# Per-class/per-rule failure exclusions (maven-pmd-plugin's excludeFromFailureFile), for findings
# that are tracked by a real follow-up ticket rather than fixed or ruleset-excluded outright.
#
# filter.RequestLoggingFilter (note the bare `filter` package: not
# com.mayureshpatel.pfdataservice.filter) is a duplicate, orphaned copy of
# com.mayureshpatel.pfdataservice.filter.RequestLoggingFilter -- both are @Component
# OncePerRequestFilter beans, so both are currently active and duplicate-logging every request in
# production. Found during PF-329 (PMD triage); deliberately left untouched pending a dedicated
# fix, tracked as PF-813. Excluding this class's finding from failing the build rather than fixing
# or ruleset-excluding the rule, so as not to touch this file at all before that ticket is picked
# up.
filter.RequestLoggingFilter=AvoidLiteralsInIfCondition
