spring:
  application:
    name: pf-data-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_finance}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-init-sql: SET timezone='UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:900000}

app:
  session:
    refresh:
      remember-me-idle: ${REFRESH_REMEMBER_ME_IDLE:14d}
      remember-me-absolute: ${REFRESH_REMEMBER_ME_ABSOLUTE:60d}
      session-only-idle: ${REFRESH_SESSION_ONLY_IDLE:8h}
      session-only-absolute: ${REFRESH_SESSION_ONLY_ABSOLUTE:24h}
      purge-cron: ${REFRESH_PURGE_CRON:0 30 3 * * *}

cors:
  allowed-origins: "http://localhost:4200"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [TraceID:%X{correlationId}] %logger{36} - %msg%n"
  level:
    root: info
    com.mayureshpatel.pfdataservice: info
    org.springframework.web: info
